name: Deploy Smart VMS ke Jagoan Hosting (cPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Validasi Composer
        run: composer validate --no-check-all

      # Build vendor di GitHub karena Composer dibatasi di hosting
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # Build asset Vite sebelum dikirim ke server
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Hapus file Git yang tidak diperlukan di server
      - name: Hapus folder .git
        run: |
          chmod -R u+w .git 2>/dev/null || true
          rm -rf .git

          if [ -d .git ]; then
            echo "GAGAL: folder .git masih ada!"
            exit 1
          fi

          echo "OK: folder .git sudah dihapus"

      # Upload aplikasi, vendor, dan hasil build ke hosting
      - name: Upload aplikasi ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          source: "."
          target: "~/public_html/smart-vms"
          rm: false
          overwrite: true

      # Jalankan konfigurasi dan optimasi Laravel di server
      - name: Setup Laravel di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          envs: APP_URL,DB_HOST,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_PORT
          script: |
            set -e

            cd ~/public_html/smart-vms

            # Buat .env jika belum tersedia
            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_NAME="Smart VMS"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}

            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            EOF

              echo ".env berhasil dibuat"
            else
              echo ".env sudah ada, tidak ditimpa"
            fi

            # Jalankan migration
            php artisan migrate --force

            # Cache konfigurasi Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Buat storage tanpa symlink karena hosting memblokir symlink
            mkdir -p public/storage

            # Set permission Laravel
            chmod -R 775 storage bootstrap/cache public/storage

            echo "===== DEPLOY SMART VMS BERHASIL ====="

        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
