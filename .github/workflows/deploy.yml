name: Deploy Smart VMS ke Jagoan Hosting (cPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Validasi Composer
        run: composer validate --no-check-all

      # Jagoan Hosting blokir eval() (DISEVAL) sehingga composer TIDAK BISA
      # dijalankan langsung di server. Solusinya: build vendor/ di runner ini,
      # lalu kirim hasilnya ke server via SCP.
      - name: Composer install (di runner, bukan di server)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # Build asset frontend (Vite) di runner, karena npm/node belum tentu
      # tersedia atau diizinkan berjalan penuh di shared hosting.
      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      # Folder .git tidak dibutuhkan di server, dan ekstraksi file
      # internalnya (pack/idx/rev) sering gagal karena permission
      # saat di-untar di server (Permission denied). File pack/idx/rev
      # di .git kadang read-only, jadi di-chmod dulu supaya rm -rf pasti
      # berhasil, lalu diverifikasi benar-benar hilang.
      - name: Hapus folder .git sebelum di-SCP
        run: |
          chmod -R u+w .git 2>/dev/null || true
          rm -rf .git
          if [ -d .git ]; then
            echo "GAGAL: folder .git masih ada!"
            exit 1
          fi
          echo "OK: folder .git sudah bersih"

      - name: Sync kode + vendor + build ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          source: "."
          target: "~/public_html/smart-vms"
          rm: false
          overwrite: true

      - name: Jalankan migrate & cache di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          envs: APP_URL,DB_HOST,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_PORT
          script: |
            set -e

            cd ~/public_html/smart-vms

            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_NAME="Smart VMS"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}

            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            EOF
              echo ".env berhasil dibuat, jangan lupa lengkapi variabel lain manual (MAIL_*, dll)"
            else
              echo ".env sudah ada, tidak ditimpa"
            fi

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Server ini blokir symlink (storage:link menghasilkan 403),
            # jadi file public disimpan langsung di public/storage, bukan symlink.
            mkdir -p public/storage

            chmod -R 775 storage bootstrap/cache public/storage

            echo "===== DEPLOY SMART VMS BERHASIL ====="
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}